

<input type="text" placeholder="Add a task here" [(ngModel)]="value" />

<button (click)="addButtonClicked(value)"><mat-icon>add</mat-icon></button>
<button (click)="clearButtonClicked()"><mat-icon>cancel</mat-icon></button>
<h2>Task List</h2>
@for (task of tasks; track task.id){
  <ul>
    <li>
      <input type="checkbox"
             [checked]="task.completed"
             (change)="toggleComplete(task)"
      />
    <span [class.completed]="task.completed">
      {{task.title}}
    </span>
      <button class="delete-button" mat-icon-button (click)="removeTask(task)">
        <mat-icon>delete</mat-icon>
      </button>
    </li>

  </ul>
}
